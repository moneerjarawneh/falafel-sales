services:
  - type: web
    name: falafel-sales
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /login
    preDeployCommand: php artisan migrate --force && php artisan db:seed --class=CategorySeeder --force
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: falafel-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: LOG_CHANNEL
        value: stderr

databases:
  - name: falafel-db
    databaseName: falafel_sales
    plan: free
    region: oregon
